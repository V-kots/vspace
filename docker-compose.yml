# Имя проекта и порты — из .env.docker (COMPOSE_PROJECT_NAME).
# docker compose --env-file .env.docker up -d --build

name: ${COMPOSE_PROJECT_NAME:-vspace}

services:
  nginx:
    build:
      context: ./docker/nginx
      dockerfile: Dockerfile
    image: ${COMPOSE_PROJECT_NAME:-vspace}-nginx:local
    restart: unless-stopped
    expose:
      - "8080"
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      VSPACE_DOMAIN: ${VSPACE_DOMAIN:-vspace.loc}
      GRAFANA_DOMAIN: ${GRAFANA_DOMAIN:-grafana.vspace.loc}
      MAIL_DOMAIN: ${MAIL_DOMAIN:-mail.vspace.loc}
    volumes:
      - ./src:/var/www/html:ro
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
      - ${COMPOSE_DATA_ROOT:-./docker-data}/nginx-logs:/var/log/nginx
      # Сертификат из docker/ssl используется, если есть; иначе контейнер
      # генерирует самоподписанный на старте (см. docker/nginx/docker-entrypoint.d).
      - ./docker/ssl:/etc/nginx/ssl-host:ro
    depends_on:
      php:
        condition: service_started
    networks:
      - app
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  php:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    image: ${COMPOSE_PROJECT_NAME:-vspace}-php:local
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./src:/var/www/html
    environment:
      PHP_IDE_CONFIG: serverName=${VSPACE_DOMAIN:-vspace.loc}
      XDEBUG_MODE: ${XDEBUG_MODE:-debug}
      XDEBUG_CONFIG: ${XDEBUG_CONFIG:-client_host=host.docker.internal client_port=9003}
      PHP_OPCACHE_VALIDATE_TIMESTAMPS: ${PHP_OPCACHE_VALIDATE_TIMESTAMPS:-0}
      PHP_OPCACHE_JIT: ${PHP_OPCACHE_JIT:-1255}
      PHP_OPCACHE_PRELOAD: ${PHP_OPCACHE_PRELOAD:-1}
      PHP_FPM_MAX_CHILDREN: ${PHP_FPM_MAX_CHILDREN:-96}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  postgres:
    image: postgres:17.6-alpine
    restart: unless-stopped
    labels:
      vspace.log_type: postgres
    # Параметры мастера для потоковой репликации. max_slot_wal_keep_size
    # ограничивает WAL, который мастер держит для остановленной реплики:
    # иначе выключенный слейв может забить диск. Если слот потерян — reset.
    command:
      - postgres
      - -c
      - wal_level=replica
      - -c
      - max_wal_senders=10
      - -c
      - max_replication_slots=10
      - -c
      - max_slot_wal_keep_size=2GB
    ports:
      - "${POSTGRES_PUBLISH_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vspace}
      POSTGRES_USER: ${POSTGRES_USER:-vspace}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secret}
      REPLICATION_USER: ${POSTGRES_REPLICATION_USER:-replicator}
      REPLICATION_PASSWORD: ${POSTGRES_REPLICATION_PASSWORD:-replicator-secret}
    volumes:
      - ${COMPOSE_DATA_ROOT:-./docker-data}/postgres:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
      - ./src/database/seeders/csv:/import:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vspace} -d ${POSTGRES_DB:-vspace}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - app

  # --- Потоковая репликация: 1 мастер (postgres) + 2 реплики ---
  # Профиль replicas, чтобы реплики не поднимались по умолчанию.
  # Управление: scripts/replication.sh up|down|status|reset.
  # Вручную:
  #   включить:  docker compose --env-file .env.docker --profile replicas up -d
  #   выключить: scripts/replication.sh down
  # Реплика сама делает base backup при пустом PGDATA и держит слот
  # репликации, поэтому повторный base backup после простоя не нужен.
  #
  # Одноразовая идемпотентная подготовка мастера: роль репликации, pg_hba,
  # слоты. Нужна и для уже существующего docker-data/postgres, где
  # docker-entrypoint-initdb.d уже не выполняется.
  postgres-replication-init:
    image: postgres:17.6-alpine
    restart: "no"
    profiles: ["replicas"]
    environment:
      PGDATA: /var/lib/postgresql/data
      PRIMARY_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-vspace}
      POSTGRES_USER: ${POSTGRES_USER:-vspace}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secret}
      REPLICATION_USER: ${POSTGRES_REPLICATION_USER:-replicator}
      REPLICATION_PASSWORD: ${POSTGRES_REPLICATION_PASSWORD:-replicator-secret}
      REPLICA_SLOTS: "vspace_replica_1 vspace_replica_2"
    entrypoint: ["sh", "/usr/local/bin/ensure-replication.sh"]
    volumes:
      - ${COMPOSE_DATA_ROOT:-./docker-data}/postgres:/var/lib/postgresql/data
      - ./docker/postgres/ensure-replication.sh:/usr/local/bin/ensure-replication.sh:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  postgres-replica-1: &postgres-replica
    image: postgres:17.6-alpine
    restart: unless-stopped
    profiles: ["replicas"]
    labels:
      vspace.log_type: postgres
    # Наружу только localhost — для HeidiSQL/DBeaver. Приложение ходит
    # напрямую в postgres-replica-* внутри сети compose.
    ports:
      - "127.0.0.1:${POSTGRES_REPLICA_1_PORT:-5433}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vspace}
      POSTGRES_USER: ${POSTGRES_USER:-vspace}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secret}
      PGDATA: /var/lib/postgresql/data
      PRIMARY_HOST: postgres
      REPLICATION_USER: ${POSTGRES_REPLICATION_USER:-replicator}
      REPLICATION_PASSWORD: ${POSTGRES_REPLICATION_PASSWORD:-replicator-secret}
      REPLICA_SLOT: vspace_replica_1
      # .pgpass лежит вне PGDATA и пересоздаётся entrypoint-скриптом на каждом
      # старте. PGPASSFILE нужен и pg_basebackup, и walreceiver-у postgres.
      PGPASSFILE: /var/lib/postgresql/.pgpass
    entrypoint: ["sh", "/usr/local/bin/replica-entrypoint.sh"]
    command: ["postgres", "-c", "hot_standby=on"]
    volumes:
      - ${COMPOSE_DATA_ROOT:-./docker-data}/postgres-replica-1:/var/lib/postgresql/data
      - ./docker/postgres/replica-entrypoint.sh:/usr/local/bin/replica-entrypoint.sh:ro
    depends_on:
      postgres:
        condition: service_healthy
      postgres-replication-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vspace} -d ${POSTGRES_DB:-vspace}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - app
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  postgres-replica-2:
    <<: *postgres-replica
    ports:
      - "127.0.0.1:${POSTGRES_REPLICA_2_PORT:-5434}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vspace}
      POSTGRES_USER: ${POSTGRES_USER:-vspace}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secret}
      PGDATA: /var/lib/postgresql/data
      PRIMARY_HOST: postgres
      REPLICATION_USER: ${POSTGRES_REPLICATION_USER:-replicator}
      REPLICATION_PASSWORD: ${POSTGRES_REPLICATION_PASSWORD:-replicator-secret}
      REPLICA_SLOT: vspace_replica_2
      PGPASSFILE: /var/lib/postgresql/.pgpass
    volumes:
      - ${COMPOSE_DATA_ROOT:-./docker-data}/postgres-replica-2:/var/lib/postgresql/data
      - ./docker/postgres/replica-entrypoint.sh:/usr/local/bin/replica-entrypoint.sh:ro

  # PgBouncer ОТКЛЮЧЁН: Laravel ходит напрямую в postgres / postgres-replica-*.
  # Чтобы вернуть — раскомментируйте блок ниже и верните php.depends_on на pgbouncer.
  # Отдельный PgBouncer на каждую реплику: Laravel ходит в pgbouncer-read-1/2,
  # поэтому режим пулинга и работа с prepared statements те же, что у мастера.
