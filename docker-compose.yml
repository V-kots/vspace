#         max-file: "3"

  redis:
    image: redis:8.4.6-alpine
    restart: unless-stopped
    labels:
      vspace.log_type: redis
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - ${COMPOSE_DATA_ROOT:-./docker-data}/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app

  mailpit:
    image: axllent/mailpit:v1.28
    restart: unless-stopped
    labels:
      vspace.log_type: mail
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"
    networks:
      - app

  loki:
    image: grafana/loki:3.4.2
    restart: unless-stopped
    command: -config.file=/etc/loki/loki-config.yaml
    volumes:
      - ./docker/loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - ${COMPOSE_DATA_ROOT:-./docker-data}/loki:/loki
    depends_on:
      init-data:
        condition: service_completed_successfully
    networks:
      - app

  alloy:
    image: grafana/alloy:v1.10.0
    restart: unless-stopped
    command:
      - run
      - /etc/alloy/config.alloy
      - --storage.path=/var/lib/alloy/data
      - --server.http.listen-addr=0.0.0.0:12345
    volumes:
      - ./docker/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - ${COMPOSE_DATA_ROOT:-./docker-data}/alloy:/var/lib/alloy/data
      - ${COMPOSE_DATA_ROOT:-./docker-data}/nginx-logs:/var/log/nginx:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki
    networks:
      - app

  # cAdvisor: метрики контейнеров (CPU, memory, network, fs) для Prometheus.
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    restart: unless-stopped
    privileged: true
    devices:
      - /dev/kmsg:/dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    ports:
      - "127.0.0.1:${CADVISOR_PORT:-8080}:8080"
    networks:
      - app
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # node-exporter: метрики хоста/Docker VM (CPU, RAM, disk, load).
  node-exporter:
    image: prom/node-exporter:v1.8.2
    restart: unless-stopped
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/host/root
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($|/)
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro
    ports:
      - "127.0.0.1:${NODE_EXPORTER_PORT:-9100}:9100"
    networks:
      - app
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  prometheus:
    image: prom/prometheus:v3.2.1
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-7d}
      - --web.enable-lifecycle
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ${COMPOSE_DATA_ROOT:-./docker-data}/prometheus:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    depends_on:
      init-data:
        condition: service_completed_successfully
      cadvisor:
        condition: service_started
      node-exporter:
        condition: service_started
    networks:
      - app
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  grafana:
    image: grafana/grafana:11.5.2
    restart: unless-stopped
    labels:
      vspace.log_type: grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SERVER_ROOT_URL: https://${GRAFANA_DOMAIN:-grafana.vspace.loc}/
      GF_SERVER_DOMAIN: ${GRAFANA_DOMAIN:-grafana.vspace.loc}
    volumes:
      - ${COMPOSE_DATA_ROOT:-./docker-data}/grafana:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      init-data:
        condition: service_completed_successfully
      loki:
        condition: service_started
    networks:
      - app

  # One-shot: bind-mount каталоги данных создаются Docker от root, а Grafana
  # пишет под uid 472, Loki — под 10001, Prometheus — под 65534 (nobody).
  # Без chown они уходят в restart loop с Permission denied.
  init-data:
    image: alpine:3.21
    restart: "no"
    command:
      - sh
      - -c
      - >-
        mkdir -p /data/grafana /data/loki /data/prometheus /data/nginx-logs &&
        chown -R 472:472 /data/grafana &&
        chown -R 10001:10001 /data/loki &&
        chown -R 65534:65534 /data/prometheus
    volumes:
      - ${COMPOSE_DATA_ROOT:-./docker-data}:/data
    networks:
      - app

networks:
  app:
    name: ${COMPOSE_PROJECT_NAME:-vspace}_net
