# Инструменты разработки (не стартуют с обычным up -d). Профиль: tools
# Пример: docker compose --env-file .env.docker -f docker-compose.yml -f docker-compose.tools.yml --profile tools run --rm node npm run build

services:
  node:
    image: node:22-bookworm
    profiles: [tools]
    working_dir: /var/www/html
    volumes:
      - ./src:/var/www/html
      # node_modules с хоста (Node 18) не подмешиваем — только Linux-биндинги из npm ci в контейнере
      - frontend_node_modules:/var/www/html/node_modules
    environment:
      npm_config_update_notifier: "false"

volumes:
  frontend_node_modules:
    name: ${COMPOSE_PROJECT_NAME:-vspace}_frontend_node_modules
