# HAProxy отключён: сервис закомментирован в docker-compose.patroni.yml.
# Файл оставлен для быстрого возврата.
global
    maxconn 2000

defaults
    mode tcp
    timeout connect 5s
    timeout client 60s
    timeout server 60s
    default-server inter 2s fall 3 rise 2

# Запись: только текущий лидер Patroni.
frontend patroni_write
    bind *:5000
    default_backend patroni_primary

backend patroni_primary
    option httpchk GET /primary
    http-check expect status 200
    server patroni-1 patroni-1:5432 check port 8008
    server patroni-2 patroni-2:5432 check port 8008
    server patroni-3 patroni-3:5432 check port 8008

# Чтение: только реплики, без лидера.
frontend patroni_read
    bind *:5001
    default_backend patroni_replicas

backend patroni_replicas
    balance roundrobin
    option httpchk GET /replica
    http-check expect status 200
    server patroni-1 patroni-1:5432 check port 8008
    server patroni-2 patroni-2:5432 check port 8008
    server patroni-3 patroni-3:5432 check port 8008

listen stats
    bind *:7000
    mode http
    stats enable
    stats uri /
    stats refresh 5s
