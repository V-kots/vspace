server {
    listen 443 ssl default_server backlog=4096;
    server_name vspace.loc localhost 127.0.0.1;

    resolver 127.0.0.11 valid=10s ipv6=off;

    ssl_certificate /etc/nginx/ssl/site.pem;
    ssl_certificate_key /etc/nginx/ssl/site-key.pem;
    include /etc/nginx/conf.d/ssl-params.conf;

    root /var/www/html/public;
    index index.php;

    charset utf-8;
    client_max_body_size 64M;

    add_header X-Request-Id $request_id always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        set $php_fpm_upstream php:9000;
        fastcgi_pass $php_fpm_upstream;
        fastcgi_keep_conn on;
        fastcgi_connect_timeout 60s;
        fastcgi_send_timeout 60s;
        fastcgi_read_timeout 60s;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTP_X_REQUEST_ID $request_id;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}

server {
    listen 80 default_server;
    server_name vspace.loc localhost 127.0.0.1;

    return 301 https://$host$request_uri;
}
