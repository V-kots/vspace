; OPcache + JIT (FPM). CLI — без opcache. validate_timestamps / preload — docker-entrypoint → 98-opcache-runtime.ini

[PHP]
realpath_cache_size = 4096K
realpath_cache_ttl = 600

[opcache]
opcache.enable = 1
; CLI без opcache/JIT: artisan-команды разовые, кэш в отдельном процессе не даёт пользы
opcache.enable_cli = 0
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 32
opcache.max_accelerated_files = 20000
opcache.max_wasted_percentage = 10
opcache.use_cwd = 1
opcache.save_comments = 1
opcache.fast_shutdown = 1
; revalidate_freq используется только при validate_timestamps=1 (local dev)
opcache.revalidate_freq = 2
opcache.jit_buffer_size = 128M
