# Имя проекта и порты — из .env.docker (COMPOSE_PROJECT_NAME).
# docker compose --env-file .env.docker up -d --build

name: ${COMPOSE_PROJECT_NAME:-vspace}

services:
  nginx:
    image: nginx:1.31.6-alpine
    restart: unless-stopped
    expose:
      - "8080"
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./src:/var/www/html:ro
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
      - ${COMPOSE_DATA_ROOT:-./docker-data}/nginx-logs:/var/log/nginx
      - ./docker/ssl/${VSPACE_DOMAIN:-vspace.loc}.pem:/etc/nginx/ssl/site.pem:ro
      - ./docker/ssl/${VSPACE_DOMAIN:-vspace.loc}-key.pem:/etc/nginx/ssl/site-key.pem:ro
    depends_on:
      php:
        condition: service_started
    networks:
      - app
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  php:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    image: ${COMPOSE_PROJECT_NAME:-vspace}-php:local
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./src:/var/www/html
    environment:
      PHP_IDE_CONFIG: serverName=${VSPACE_DOMAIN:-vspace.loc}
      XDEBUG_MODE: ${XDEBUG_MODE:-debug}
      XDEBUG_CONFIG: ${XDEBUG_CONFIG:-client_host=host.docker.internal client_port=9003}
      PHP_OPCACHE_VALIDATE_TIMESTAMPS: ${PHP_OPCACHE_VALIDATE_TIMESTAMPS:-0}
      PHP_OPCACHE_JIT: ${PHP_OPCACHE_JIT:-1255}
      PHP_OPCACHE_PRELOAD: ${PHP_OPCACHE_PRELOAD:-1}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  postgres:
    image: postgres:17.6-alpine
    restart: unless-stopped
    labels:
      vspace.log_type: postgres
    ports:
      - "${POSTGRES_PUBLISH_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vspace}
      POSTGRES_USER: ${POSTGRES_USER:-vspace}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secret}
    volumes:
      - ${COMPOSE_DATA_ROOT:-./docker-data}/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vspace} -d ${POSTGRES_DB:-vspace}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - app

  redis:
    image: redis:8.4.6-alpine
    restart: unless-stopped
    labels:
      vspace.log_type: redis
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - ${COMPOSE_DATA_ROOT:-./docker-data}/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app

  mailpit:
    image: axllent/mailpit:v1.28
    restart: unless-stopped
    labels:
      vspace.log_type: mail
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"
    networks:
      - app

  loki:
    image: grafana/loki:3.4.2
    restart: unless-stopped
    command: -config.file=/etc/loki/loki-config.yaml
    volumes:
      - ./docker/loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - ${COMPOSE_DATA_ROOT:-./docker-data}/loki:/loki
    networks:
      - app

  alloy:
    image: grafana/alloy:v1.10.0
    restart: unless-stopped
    command:
      - run
      - /etc/alloy/config.alloy
      - --storage.path=/var/lib/alloy/data
      - --server.http.listen-addr=0.0.0.0:12345
    volumes:
      - ./docker/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - ${COMPOSE_DATA_ROOT:-./docker-data}/alloy:/var/lib/alloy/data
      - ${COMPOSE_DATA_ROOT:-./docker-data}/nginx-logs:/var/log/nginx:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki
    networks:
      - app

  # prometheus:
  #   image: prom/prometheus:v3.2.1
  #   restart: unless-stopped
  #   command:
  #     - --config.file=/etc/prometheus/prometheus.yml
  #     - --storage.tsdb.path=/prometheus
  #     - --web.enable-lifecycle
  #   volumes:
  #     - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
  #     - ${COMPOSE_DATA_ROOT:-./docker-data}/prometheus:/prometheus
  #   networks:
  #     - app

  grafana:
    image: grafana/grafana:11.5.2
    restart: unless-stopped
    labels:
      vspace.log_type: grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SERVER_ROOT_URL: https://${GRAFANA_DOMAIN:-grafana.vspace.loc}/
      GF_SERVER_DOMAIN: ${GRAFANA_DOMAIN:-grafana.vspace.loc}
    volumes:
      - ${COMPOSE_DATA_ROOT:-./docker-data}/grafana:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - loki
    networks:
      - app

networks:
  app:
    name: ${COMPOSE_PROJECT_NAME:-vspace}_net
