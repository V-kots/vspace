global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]

  # Метрики контейнеров: CPU, memory, network, fs (dashboard Docker Containers).
  - job_name: cadvisor
    static_configs:
      - targets: [cadvisor:8080]
        labels:
          service: cadvisor

  # Метрики хоста/Docker VM: CPU, RAM, disk, load (gauges в dashboard).
  - job_name: node
    static_configs:
      - targets: [node-exporter:9100]
        labels:
          service: node
