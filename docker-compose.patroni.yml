#       - "127.0.0.1:${PATRONI_WRITE_PORT:-5000}:5000"
#       - "127.0.0.1:${PATRONI_READ_PORT:-5001}:5001"
#       - "127.0.0.1:${PATRONI_STATS_PORT:-7000}:7000"
