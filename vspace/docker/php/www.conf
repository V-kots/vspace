[www]
user = www-data
group = www-data
listen = 9000
listen.backlog = 2048
request_terminate_timeout = 60s
pm = dynamic
pm.max_children = 50
pm.start_servers = 10
pm.min_spare_servers = 5
pm.max_spare_servers = 20
pm.max_requests = 500
pm.process_idle_timeout = 10s
clear_env = no
catch_workers_output = yes
decorate_workers_output = no
pm.status_path = /status
ping.path = /ping
