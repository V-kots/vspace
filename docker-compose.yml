#       DB_NAME: ${POSTGRES_DB:-vspace}
#       DB_USER: ${POSTGRES_USER:-vspace}
#       DB_PASSWORD: ${POSTGRES_PASSWORD:-secret}
#       AUTH_TYPE: scram-sha-256
#       POOL_MODE: ${PGBOUNCER_POOL_MODE:-transaction}
#       MAX_CLIENT_CONN: ${PGBOUNCER_MAX_CLIENT_CONN:-1000}
#       DEFAULT_POOL_SIZE: ${PGBOUNCER_DEFAULT_POOL_SIZE:-32}
#       MAX_PREPARED_STATEMENTS: ${PGBOUNCER_MAX_PREPARED_STATEMENTS:-100}
#     ulimits:
#       nofile:
#         soft: 65536
#         hard: 65536
#     depends_on:
#       postgres-replica-1:
#         condition: service_healthy
#     healthcheck:
#       test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U ${POSTGRES_USER:-vspace} -d ${POSTGRES_DB:-vspace}"]
#       interval: 10s
